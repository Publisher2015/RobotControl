<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Robot Control</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d1015;
    color: white;
    min-height: 100vh;
}

.container {
    width: min(950px, 94%);
    margin: 30px auto;
}

header {
    background: #191d24;
    border-radius: 24px;
    padding: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    color: #8d95a3;
    margin-top: 7px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    color: #aaa;
}

.dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #777;
}

.dot.connected {
    background: #35e06f;
    box-shadow: 0 0 12px #35e06f;
}

button {
    border: none;
    color: white;
    background: #292f39;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.15s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

.connect {
    background: #246bfe;
}

.card {
    background: #191d24;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 20px;
}

.card h2 {
    margin-top: 0;
}

.hidden {
    display: none;
}

.power {
    width: 100%;
    font-size: 22px;
    font-weight: bold;
    padding: 20px;
}

.power.on {
    background: #168344;
}

input[type="range"] {
    width: 100%;
    accent-color: #3979ff;
}

.value {
    text-align: center;
    margin-top: 10px;
    font-size: 20px;
}

.colours {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.red {
    background: #d93232;
}

.green {
    background: #25a653;
}

.blue {
    background: #2768d8;
}

.purple {
    background: #913bd0;
}

.white {
    background: #eeeeee;
    color: #111;
}

.rainbow {
    width: 100%;
    margin-top: 15px;
    background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        green,
        cyan,
        blue,
        violet
    );
    font-weight: bold;
}

.detected {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.feature {
    background: #242a33;
    border-radius: 15px;
    padding: 18px;
    text-align: center;
}

.feature-icon {
    font-size: 30px;
}

.feature-name {
    margin-top: 8px;
    font-weight: bold;
}

.message {
    text-align: center;
    color: #8d95a3;
    margin: 20px 0;
    min-height: 20px;
}

@media (max-width: 600px) {

    header {
        flex-direction: column;
        align-items: stretch;
    }

    .colours {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header>

    <div>
        <h1>🤖 AI Robot Control</h1>

        <div class="subtitle">
            Automatic hardware detection
        </div>

        <div class="status">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <button class="connect" onclick="connectRobot()">
        🔌 Connect Robot
    </button>

</header>


<!-- DETECTED HARDWARE -->

<div class="card">

    <h2>🔎 Detected Hardware</h2>

    <div id="detectedHardware" class="detected">

        <div class="feature">
            <div class="feature-icon">❔</div>
            <div class="feature-name">
                Waiting for robot...
            </div>
        </div>

    </div>

</div>


<!-- LED CONTROL -->

<div id="ledSection" class="card hidden">

    <h2>💡 LED</h2>

    <button id="powerButton"
            class="power"
            onclick="togglePower()">

        💡 LED OFF

    </button>


    <h3>🔆 Brightness</h3>

    <input
        id="brightness"
        type="range"
        min="0"
        max="255"
        value="128"
        oninput="changeBrightness(this.value)"
    >

    <div class="value">

        <span id="brightnessValue">128</span>
        / 255

    </div>

</div>


<!-- RGB CONTROL -->

<div id="rgbSection" class="card hidden">

    <h2>🌈 RGB LED</h2>

    <div class="colours">

        <button class="red"
                onclick="setColour(0)">
            🔴 Red
        </button>

        <button class="green"
                onclick="setColour(1)">
            🟢 Green
        </button>

        <button class="blue"
                onclick="setColour(2)">
            🔵 Blue
        </button>

        <button class="purple"
                onclick="setColour(3)">
            🟣 Purple
        </button>

        <button class="white"
                onclick="setColour(4)">
            ⚪ White
        </button>

    </div>

    <button class="rainbow"
            onclick="rainbow()">

        🌈 Rainbow Mode

    </button>

</div>


<div id="message" class="message">
    Connect your ESP32 using USB.
</div>

</div>


<script>

// ==========================================
// SERIAL VARIABLES
// ==========================================

let port = null;
let writer = null;
let reader = null;

let robotConnected = false;
let lightOn = false;

let detectedFeatures = [];


// ==========================================
// CONNECT
// ==========================================

async function connectRobot() {

    if (!("serial" in navigator)) {

        alert(
            "Web Serial is not supported by this browser. Try Chrome or Edge."
        );

        return;
    }

    try {

        port = await navigator.serial.requestPort();

        await port.open({
            baudRate: 115200
        });

        writer = port.writable.getWriter();

        robotConnected = true;

        document.getElementById("statusText").textContent =
            "Robot Connected";

        document.getElementById("statusDot")
            .classList.add("connected");

        document.getElementById("message").textContent =
            "Connected! Detecting hardware...";

        // Start listening for ESP32 messages
        startReader();

        // Ask ESP32 what hardware it has
        await sendCommand("IDENTIFY");

    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "Connection cancelled or failed.";

    }
}


// ==========================================
// SERIAL READER
// ==========================================

async function startReader() {

    if (!port || !port.readable) {
        return;
    }

    reader = port.readable.getReader();

    let buffer = "";

    try {

        while (true) {

            const { value, done } = await reader.read();

            if (done) {
                break;
            }

            const text =
                new TextDecoder().decode(value);

            buffer += text;

            const lines = buffer.split("\n");

            buffer = lines.pop();

            for (const line of lines) {

                handleRobotMessage(
                    line.trim()
                );
            }
        }

    } catch (error) {

        console.log(
            "Serial reader stopped:",
            error
        );

    }
}


// ==========================================
// ROBOT MESSAGES
// ==========================================

function handleRobotMessage(message) {

    if (!message) {
        return;
    }

    console.log("Robot:", message);


    // DEVICE NAME

    if (message.startsWith("DEVICE:")) {

        const device =
            message.substring(7);

        document.getElementById("message").textContent =
            "Detected: " + device;

        return;
    }


    // FEATURE

    if (message.startsWith("FEATURE:")) {

        const feature =
            message.substring(8);

        if (!detectedFeatures.includes(feature)) {

            detectedFeatures.push(feature);

            updateHardwareDisplay();
            updateControls();
        }

        return;
    }


    // READY

    if (message === "READY") {

        document.getElementById("message").textContent =
            "Robot ready! 🤖";

        updateHardwareDisplay();
        updateControls();

        return;
    }


    // NORMAL RESPONSES

    if (message.startsWith("OK:")) {

        console.log(message);

    }
}


// ==========================================
// HARDWARE DISPLAY
// ==========================================

function updateHardwareDisplay() {

    const container =
        document.getElementById("detectedHardware");

    container.innerHTML = "";

    if (detectedFeatures.length === 0) {

        container.innerHTML = `
            <div class="feature">
                <div class="feature-icon">❔</div>
                <div class="feature-name">
                    No features detected
                </div>
            </div>
        `;

        return;
    }


    detectedFeatures.forEach(feature => {

        let icon = "🔧";
        let name = feature;


        if (feature === "RGB") {
            icon = "🌈";
            name = "RGB LED";
        }

        if (feature === "LED") {
            icon = "💡";
            name = "3W LED";
        }

        if (feature === "JOYSTICK") {
            icon = "🎮";
            name = "Joystick";
        }

        if (feature === "SERVO") {
            icon = "⚙️";
            name = "Servo";
        }

        if (feature === "CAMERA") {
            icon = "📷";
            name = "Camera";
        }

        if (feature === "DISTANCE") {
            icon = "📡";
            name = "Distance Sensor";
        }


        container.innerHTML += `

            <div class="feature">

                <div class="feature-icon">
                    ${icon}
                </div>

                <div class="feature-name">
                    ${name}
                </div>

            </div>

        `;

    });

}


// ==========================================
// SHOW/HIDE CONTROLS
// ==========================================

function updateControls() {

    // RGB controls

    if (detectedFeatures.includes("RGB")) {

        document
            .getElementById("rgbSection")
            .classList.remove("hidden");

    } else {

        document
            .getElementById("rgbSection")
            .classList.add("hidden");
    }


    // LED controls

    if (detectedFeatures.includes("LED")) {

        document
            .getElementById("ledSection")
            .classList.remove("hidden");

    } else {

        document
            .getElementById("ledSection")
            .classList.add("hidden");
    }

}


// ==========================================
// SEND COMMAND
// ==========================================

async function sendCommand(command) {

    if (!writer) {

        document.getElementById("message").textContent =
            "Connect the robot first.";

        return;
    }

    try {

        const data =
            new TextEncoder()
                .encode(command + "\n");

        await writer.write(data);

        console.log("Sent:", command);

    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "Could not send command.";
    }
}


// ==========================================
// POWER
// ==========================================

function togglePower() {

    lightOn = !lightOn;

    const button =
        document.getElementById("powerButton");


    if (lightOn) {

        sendCommand("ON");

        button.textContent =
            "💡 LED ON";

        button.classList.add("on");

    } else {

        sendCommand("OFF");

        button.textContent =
            "💡 LED OFF";

        button.classList.remove("on");
    }
}


// ==========================================
// BRIGHTNESS
// ==========================================

function changeBrightness(value) {

    document.getElementById("brightnessValue")
        .textContent = value;

    sendCommand(
        "BRIGHTNESS:" + value
    );
}


// ==========================================
// COLOUR
// ==========================================

function setColour(number) {

    sendCommand(
        "COLOUR:" + number
    );
}


// ==========================================
// RAINBOW
// ==========================================

function rainbow() {

    sendCommand("RAINBOW");
}

</script>

</body>
</html>
