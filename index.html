<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Robot Control</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101216;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: min(900px, 94%);
    background: #191c22;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #aaa;
}

.dot {
    width: 11px;
    height: 11px;
    background: #777;
    border-radius: 50%;
}

.connected {
    background: #35e06f;
    box-shadow: 0 0 12px #35e06f;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    font-size: 16px;
    border-radius: 14px;
    padding: 14px 20px;
    background: #292e38;
    transition: .15s;
}

button:hover {
    transform: translateY(-2px);
    background: #353b47;
}

.connect {
    background: #246bfe;
}

.connect:hover {
    background: #3979ff;
}

.power {
    width: 100%;
    font-size: 22px;
    font-weight: bold;
    padding: 20px;
    background: #272c35;
    margin-bottom: 25px;
}

.power.on {
    background: #168344;
}

.section {
    background: #20242c;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
}

.section h2 {
    margin-top: 0;
    font-size: 19px;
}

input[type="range"] {
    width: 100%;
}

.value {
    text-align: center;
    font-size: 20px;
    margin-top: 10px;
}

.colours {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.colour {
    padding: 18px 5px;
}

.red { background: #d93232; }
.green { background: #25a653; }
.blue { background: #2768d8; }
.purple { background: #913bd0; }
.white {
    background: #eee;
    color: #111;
}

.rainbow {
    width: 100%;
    background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        green,
        cyan,
        blue,
        violet
    );
    color: white;
    font-weight: bold;
}

.message {
    text-align: center;
    color: #888;
    margin-top: 15px;
    min-height: 20px;
}

@media (max-width: 600px) {
    .container {
        padding: 20px;
    }

    header {
        flex-direction: column;
        align-items: stretch;
    }

    .colours {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div>
        <h1>🤖 AI Robot Control</h1>
        <div class="status">
            <span id="dot" class="dot"></span>
            <span id="status">Disconnected</span>
        </div>
    </div>

    <button class="connect" onclick="connectRobot()">
        🔌 Connect Robot
    </button>
</header>

<button id="powerButton" class="power" onclick="togglePower()">
    💡 LED OFF
</button>

<div class="section">
    <h2>🔆 Brightness</h2>

    <input
        id="brightness"
        type="range"
        min="0"
        max="255"
        value="128"
        oninput="changeBrightness(this.value)"
    >

    <div class="value">
        <span id="brightnessValue">128</span> / 255
    </div>
</div>

<div class="section">

    <h2>🎨 Colour</h2>

    <div class="colours">

        <button class="colour red" onclick="setColour(0)">
            🔴 Red
        </button>

        <button class="colour green" onclick="setColour(1)">
            🟢 Green
        </button>

        <button class="colour blue" onclick="setColour(2)">
            🔵 Blue
        </button>

        <button class="colour purple" onclick="setColour(3)">
            🟣 Purple
        </button>

        <button class="colour white" onclick="setColour(4)">
            ⚪ White
        </button>

    </div>

    <br>

    <button class="rainbow" onclick="rainbow()">
        🌈 Rainbow Mode
    </button>

</div>

<div id="message" class="message">
    Connect your ESP32 using USB.
</div>

</div>

<script>

let port = null;
let writer = null;

let robotConnected = false;
let lightOn = false;


// ============================
// CONNECT ROBOT
// ============================

async function connectRobot() {

    if (!("serial" in navigator)) {

        alert(
            "Web Serial is not supported by this browser. Try Chrome or Edge."
        );

        return;
    }

    try {

        port = await navigator.serial.requestPort();

        await port.open({
            baudRate: 115200
        });

        writer = port.writable.getWriter();

        robotConnected = true;

        document.getElementById("status").textContent =
            "Robot Connected";

        document.getElementById("dot").classList.add("connected");

        document.getElementById("message").textContent =
            "USB connection established! 🤖";

    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "Connection cancelled or failed.";
    }
}


// ============================
// SEND COMMAND
// ============================

async function sendCommand(command) {

    if (!writer) {

        document.getElementById("message").textContent =
            "Connect the robot first.";

        return;
    }

    try {

        const data =
            new TextEncoder().encode(command + "\n");

        await writer.write(data);

        document.getElementById("message").textContent =
            "Sent: " + command;

    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "Could not send command.";
    }
}


// ============================
// POWER
// ============================

function togglePower() {

    lightOn = !lightOn;

    if (lightOn) {

        sendCommand("ON");

        document.getElementById("powerButton").textContent =
            "💡 LED ON";

        document.getElementById("powerButton").classList.add("on");

    } else {

        sendCommand("OFF");

        document.getElementById("powerButton").textContent =
            "💡 LED OFF";

        document.getElementById("powerButton").classList.remove("on");
    }
}


// ============================
// BRIGHTNESS
// ============================

function changeBrightness(value) {

    document.getElementById("brightnessValue").textContent =
        value;

    sendCommand("BRIGHTNESS:" + value);
}


// ============================
// COLOUR
// ============================

function setColour(number) {

    sendCommand("COLOUR:" + number);
}


// ============================
// RAINBOW
// ============================

function rainbow() {

    sendCommand("RAINBOW");
}

</script>

</body>
</html>
